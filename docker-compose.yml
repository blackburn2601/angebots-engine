services:
  postgres:
    image: postgres:16-alpine
    container_name: angebots-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: angebots
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: angebots_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
